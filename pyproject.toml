[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gvarlink"
version = "0.1.0"
description = "Bounded numeric-only persistence of explicitly shared gvar uncertainty sources"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{name = "GVarLink contributors"}]
dependencies = ["numpy>=1.24,<3", "gvar==13.1.10"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
gvarlink = "gvarlink.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.setuptools.packages.find]
where = ["src"]
